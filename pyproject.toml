[project]
name = "datapilot"
version = "0.0.1"
description = "A bounded e-commerce metric specification and controlled SQL agent."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25,<26",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-deepseek>=1.1.1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "redis>=6,<8",
  "sqlalchemy>=2,<3",
  "sqlglot>=27,<40",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/common", "tests/datapilot"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires the isolated PostgreSQL/Redis services",
  "live: opt-in real model requests, never run in default CI",
]

[tool.mypy]
python_version = "3.12"
strict = true
