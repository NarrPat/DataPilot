pid /tmp/datapilot-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Keep the fixed API target current after a Compose container replacement.
    upstream datapilot_api {
        zone datapilot_api 64k;
        resolver 127.0.0.11 valid=1s ipv6=off;
        resolver_timeout 2s;
        server api:8000 resolve;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/datapilot/tls/fullchain.pem;
        ssl_certificate_key /run/datapilot/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 32k;
        add_header X-Content-Type-Options nosniff always;
        location ~ ^/(api/|health/) {
            proxy_pass http://datapilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 45s;
            proxy_send_timeout 10s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
