<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="回放 DataPilot 如何从一句净额问题走到可核对的 SQL 和结果。">
  <title>DataPilot · 工作台演示</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #172c29; background: #f7f9f8; }
    body { max-width: 62rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; }
    header strong { font-size: 1.1rem; }
    nav { display: flex; flex-wrap: wrap; gap: 1.25rem; }
    a { color: #075f4d; text-underline-offset: .18rem; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); margin: 2rem 0 .25rem; line-height: 1.25; }
    p { margin: .65rem 0 1.3rem; }
    video { display: block; width: 100%; background: #172c29; border-radius: .5rem; }
    .chapters { margin-top: 1rem; gap: .6rem 1rem; }
    footer { margin-top: .9rem; }
  </style>
</head>
<body>
  <header>
    <strong>DataPilot</strong>
    <nav aria-label="项目链接">
      <a href="https://github.com/NarrPat/DataPilot">GitHub 仓库</a>
      <a href="https://github.com/NarrPat/DataPilot/blob/main/docs/verification.md">查看验收证据</a>
    </nav>
  </header>
  <main>
    <h1>十月华东的净额是多少？</h1>
    <p>跟着工作台确认“净额”的口径，再看 SQL 如何把支付和退款算成 78.69 元。画面回放了真实模型验收保存的响应。</p>
    <video id="demo" controls playsinline preload="metadata" poster="net-flow.png" aria-label="DataPilot 工作台演示">
      <source src="demo.mp4" type="video/mp4">
      <track kind="captions" src="demo.zh-CN.vtt" srclang="zh-CN" label="简体中文">
      <a href="demo.mp4">打开 MP4 视频</a>
    </video>
    <nav class="chapters" aria-label="跳到视频章节">
      <a href="demo.mp4#t=0">00:00 问净额</a>
      <a href="demo.mp4#t=36.2">00:36 核对 SQL</a>
      <a href="demo.mp4#t=87.7">01:27 比较两期</a>
      <a href="demo.mp4#t=127.9">02:07 看边界情况</a>
      <a href="demo.mp4#t=162.4">02:42 查验收记录</a>
    </nav>
  </main>
  <footer><a href="demo.mp4" download>下载视频</a></footer>
  <script>
    const player = document.querySelector('#demo');
    for (const link of document.querySelectorAll('.chapters a')) {
      link.addEventListener('click', (event) => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        player.currentTime = Number(link.hash.slice(3));
        player.play().catch(() => player.focus());
      });
    }
  </script>
</body>
</html>
